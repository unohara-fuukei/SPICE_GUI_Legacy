[package]
name = "spice-native"
version = "0.1.0"
edition = "2021"
description = "SPICE GUI — native (WebView-free) port. Rust + egui."
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", optional = true, features = ["json"] }
serde_json = "1" # required by project JSON; also pulled by remote-ai
rfd = { version = "0.13", optional = true }

[features]
default = []
file-dialog = ["rfd"]
remote-ai = ["ureq"]

# Keep the binary lean: LTO on release
[profile.release]
lto = true
opt-level = 2
