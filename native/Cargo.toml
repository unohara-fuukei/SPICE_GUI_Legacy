[package]
name = "spice-native"
version = "0.1.0"
edition = "2021"
description = "SPICE GUI — native (WebView-free) port. Rust + egui."
license = "MIT"

[lib]
name = "spice_native"
crate-type = ["cdylib", "lib"]

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", optional = true, features = ["json"] }
serde_json = "1"
winit = "0.30" # required by project JSON; also pulled by remote-ai
rfd = { version = "0.13", optional = true }

[features]
default = []
file-dialog = ["rfd"]
remote-ai = ["ureq"]
android = ["eframe/android-native-activity"]

# Keep the binary lean: LTO on release
[profile.release]
lto = true
opt-level = 2

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
